name: Java CI

on:
  push:
    branches:
      - main
    paths:
      - "pom.xml"
      - "src/**"
      - ".github/workflows/java-ci.yml"
  pull_request:
    paths:
      - "pom.xml"
      - "src/**"
      - ".github/workflows/java-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify
        run: mvn --batch-mode --no-transfer-progress verify
