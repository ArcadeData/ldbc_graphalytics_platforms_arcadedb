name: ArcadeDB Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which benchmark mode to run"
        required: false
        default: all
        type: choice
        options:
          - all
          - mode1
          - mode2
          - mode3
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: arcadedb-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mode1-official:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'all' || github.event.inputs.mode == 'mode1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install zstd
        run: sudo apt-get update -y && sudo apt-get install -y zstd

      - name: Install Python dependencies
        run: pip install requests

      - name: Build
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Download dataset
        run: python3 datasets.py download datagen-7_5-fb

      - name: Extract and configure distribution
        run: |
          TARBALL=$(ls graphalytics-*-arcadedb-*-bin.tar.gz)
          tar xf "$TARBALL"
          DIST=$(tar tzf "$TARBALL" | head -1 | cut -d/ -f1)
          cd "$DIST"
          cp -r config-template config
          sed -i "s|^graphs.root-directory =\$|graphs.root-directory = $GITHUB_WORKSPACE/datasets/datagen-7_5-fb|" config/benchmark.properties
          sed -i "s|^graphs.validation-directory =\$|graphs.validation-directory = $GITHUB_WORKSPACE/datasets/datagen-7_5-fb|" config/benchmark.properties
          sed -i "s|^benchmark.custom.graphs = .*|benchmark.custom.graphs = datagen-7_5-fb|" config/benchmarks/custom.properties
          sed -i "s|^benchmark.custom.algorithms = .*|benchmark.custom.algorithms = BFS, WCC, PR, CDLP, LCC, SSSP|" config/benchmarks/custom.properties
          sed -i "s|^platform.olap = false|platform.olap = true|" config/platform.properties
          sed -i "s|-Xms16g -Xmx16g|-Xms8g -Xmx8g|" bin/sh/prepare-benchmark.sh
          echo "DIST=$DIST" >> "$GITHUB_ENV"

      - name: Run Mode 1 benchmark
        run: |
          cd "$DIST"
          bash bin/sh/run-benchmark.sh

      - name: Summarize results
        if: always()
        run: |
          cd "$DIST"
          LATEST=$(ls -td report/*ARCADEDB* | head -1)
          {
            echo "### Mode 1 — Official LDBC Graphalytics (datagen-7_5-fb)"
            echo
            echo "| Algorithm | Load (s) | Processing (s) |"
            echo "|---|---|---|"
            python3 -c "
          import json
          with open('$LATEST/json/results.json') as f:
              data = json.load(f)
          result = data.get('result', data.get('experiments', {}))
          runs = result.get('runs', {})
          jobs = result.get('jobs', {})
          for rid, r in sorted(runs.items(), key=lambda x: x[1]['timestamp']):
              algo = next(j['algorithm'] for j in jobs.values() if rid in j['runs'])
              print(f\"| {algo} | {r['load_time']} | {r['processing_time']} |\")
          "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Convert results to benchmark JSON
        if: always()
        run: |
          cd "$DIST"
          LATEST=$(ls -td report/*ARCADEDB* | head -1)
          python3 "$GITHUB_WORKSPACE/.github/scripts/mode1_to_bench_json.py" "$LATEST/json/results.json" > "$GITHUB_WORKSPACE/bench-data.json.tmp"
          python3 -c "import json,sys; sys.exit(0 if json.load(open('$GITHUB_WORKSPACE/bench-data.json.tmp')) else 1)"
          mv "$GITHUB_WORKSPACE/bench-data.json.tmp" "$GITHUB_WORKSPACE/bench-data.json"

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mode1-bench-data
          path: bench-data.json
          retention-days: 90

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mode1-official-report
          path: ${{ env.DIST }}/report/
          retention-days: 90

  mode2-embedded:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'all' || github.event.inputs.mode == 'mode2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install zstd
        run: sudo apt-get update -y && sudo apt-get install -y zstd

      - name: Install Python dependencies
        run: pip install requests

      - name: Build
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Download dataset
        run: python3 datasets.py download datagen-7_5-fb

      - name: Compile and run embedded benchmark
        run: |
          LDBC_JAR="$GITHUB_WORKSPACE/target/graphalytics-platforms-arcadedb-0.1-SNAPSHOT-default.jar"
          cd ldbc-native
          javac --add-modules jdk.incubator.vector -cp "$LDBC_JAR" ArcadeDBEmbeddedBenchmark.java
          java --add-modules jdk.incubator.vector -Xms8g -Xmx8g -cp ".:$LDBC_JAR" ArcadeDBEmbeddedBenchmark | tee "$GITHUB_WORKSPACE/mode2-output.log"

      - name: Summarize results
        if: always()
        run: |
          {
            echo "### Mode 2 — ArcadeDB Embedded (datagen-7_5-fb)"
            echo
            echo "| Metric | Time |"
            echo "|---|---|"
            grep -E "^(LOAD|PR|WCC|BFS|LCC|SSSP|CDLP)\s" mode2-output.log | awk '{printf "| %s | %s |\n", $1, $2}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Convert results to benchmark JSON
        if: always()
        run: |
          python3 .github/scripts/log_to_bench_json.py mode2-output.log LOAD PR WCC BFS LCC SSSP CDLP > bench-data.json.tmp
          python3 -c "import json,sys; sys.exit(0 if json.load(open('bench-data.json.tmp')) else 1)"
          mv bench-data.json.tmp bench-data.json

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mode2-bench-data
          path: bench-data.json
          retention-days: 90

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mode2-embedded-log
          path: mode2-output.log
          retention-days: 90

  mode3-lsqb:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'all' || github.event.inputs.mode == 'mode3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install zstd
        run: sudo apt-get update -y && sudo apt-get install -y zstd

      - name: Install Python dependencies
        run: pip install requests

      - name: Build
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Download dataset
        run: python3 datasets.py download lsqb-sf0.1 --format merged-fk

      - name: Compile and run LSQB embedded benchmark
        run: |
          LDBC_JAR="$GITHUB_WORKSPACE/target/graphalytics-platforms-arcadedb-0.1-SNAPSHOT-default.jar"
          cd lsqb
          javac -cp "$LDBC_JAR" ArcadeDBEmbeddedLSQB.java
          java -Xms8g -Xmx8g -Ddataset.dir="$GITHUB_WORKSPACE/datasets/social-network-sf0.1-merged-fk" -cp ".:$LDBC_JAR" ArcadeDBEmbeddedLSQB --reset | tee "$GITHUB_WORKSPACE/mode3-output.log"

      - name: Summarize results
        if: always()
        run: |
          {
            echo "### Mode 3 — LSQB Embedded (SF0.1)"
            echo
            echo "| Query | Time |"
            echo "|---|---|"
            grep -E "^(LOAD|Q[1-9])\s" mode3-output.log | awk '{printf "| %s | %s |\n", $1, $2}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Convert results to benchmark JSON
        if: always()
        run: |
          python3 .github/scripts/log_to_bench_json.py mode3-output.log LOAD Q1 Q2 Q3 Q4 Q5 Q6 Q7 Q8 Q9 > bench-data.json.tmp
          python3 -c "import json,sys; sys.exit(0 if json.load(open('bench-data.json.tmp')) else 1)"
          mv bench-data.json.tmp bench-data.json

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mode3-bench-data
          path: bench-data.json
          retention-days: 90

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mode3-lsqb-log
          path: mode3-output.log
          retention-days: 90

  publish-benchmarks:
    needs: [mode1-official, mode2-embedded, mode3-lsqb]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Mode 1 benchmark data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: mode1-bench-data
          path: mode1-bench-data

      - name: Download Mode 2 benchmark data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: mode2-bench-data
          path: mode2-bench-data

      - name: Download Mode 3 benchmark data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: mode3-bench-data
          path: mode3-bench-data

      - name: Publish Mode 1 results
        id: mode1_publish
        if: hashFiles('mode1-bench-data/bench-data.json') != ''
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: "ArcadeDB Mode 1 — Official LDBC Graphalytics"
          tool: 'customSmallerIsBetter'
          output-file-path: mode1-bench-data/bench-data.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/mode1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true

      - name: Publish Mode 2 results
        id: mode2_publish
        if: hashFiles('mode2-bench-data/bench-data.json') != ''
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: "ArcadeDB Mode 2 — Embedded (datagen-7_5-fb)"
          tool: 'customSmallerIsBetter'
          output-file-path: mode2-bench-data/bench-data.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/mode2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true

      - name: Publish Mode 3 results
        id: mode3_publish
        if: hashFiles('mode3-bench-data/bench-data.json') != ''
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: "ArcadeDB Mode 3 — LSQB Embedded (SF0.1)"
          tool: 'customSmallerIsBetter'
          output-file-path: mode3-bench-data/bench-data.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench/mode3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true

      - name: Publish landing page
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.github/pages
          destination_dir: .
          keep_files: true
          exclude_assets: ''

      - name: Fail if any mode regressed
        env:
          M1: ${{ steps.mode1_publish.outcome }}
          M2: ${{ steps.mode2_publish.outcome }}
          M3: ${{ steps.mode3_publish.outcome }}
        run: |
          for outcome in "$M1" "$M2" "$M3"; do
            [ "$outcome" = "failure" ] && exit 1
          done
          exit 0
