name: Scripts CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/scripts-ci.yml"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/scripts-ci.yml"

permissions:
  contents: read

concurrency:
  group: scripts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run benchmark script tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
