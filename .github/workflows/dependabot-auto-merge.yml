# Merges a Dependabot pull request once someone has approved it.
#
# Adapted from ArcadeData/arcadedb's workflow of the same name. A push made with the repository's
# GITHUB_TOKEN starts no workflow run at all, so main's push-triggered jobs (Java CI, Scripts CI)
# stay quiet on a Dependabot merge; the PR's own CI already ran on the branch. The `[skip ci]`
# marker is kept in the subject anyway: it says out loud what the merge is doing, and it is what
# would carry the behaviour if this ever has to merge with a PAT or an App token instead.
name: Dependabot auto-merge

on:
  pull_request_review:
    types: [ submitted ]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Conditions: author is dependabot[bot], one approval, base is main. There is deliberately no
    # green-CI condition. The actor here is the human who approved, not dependabot[bot], so this
    # run gets a writable GITHUB_TOKEN rather than the read-only one Dependabot-triggered
    # workflows get.
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # An ArcadeDB engine bump (com.arcadedb:*, pom.xml's arcadedb.version) is never a routine
      # dependency update here: the engine IS what this repository benchmarks. Moving it changes
      # every published number, and CLAUDE.md requires a re-run plus updates to
      # ArcadeDB-release-progress.md, the README tables and results-*.md for each new engine
      # version. The pom also tracks a SNAPSHOT on purpose, which Dependabot would replace with a
      # release. Such a PR is handled by hand (see #29), never merged on one approval.
      - name: Decide whether this PR may be merged unattended
        id: guard
        env:
          # Through the environment, never interpolated into the script: a pull request title is
          # attacker-controlled text, and `${{ }}` would splice it straight into the shell.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json mergeable,headRefOid > pr.json
          # Everything below is decided about ONE commit, and the merge is pinned to it: Dependabot
          # can force-push the branch between this read and the merge, and a head that moved must
          # fail the run instead of merging a commit this guard never saw.
          head=$(jq -r '.headRefOid' pr.json)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          # The whole PR against main, as of that commit (not just its last commit).
          gh api "repos/$GITHUB_REPOSITORY/compare/main...$head" \
            -H 'Accept: application/vnd.github.diff' > pr.diff
          if printf '%s\n' "$TITLE" | grep -q 'com\.arcadedb' ||
             grep -Eq '^[+-][[:space:]]*<arcadedb\.version>' pr.diff; then
            echo "This PR moves the ArcadeDB engine: that needs a benchmark re-run and doc" \
                 "updates, so it is reviewed by hand. Leaving it open."
            echo "merge=false" >> "$GITHUB_OUTPUT"
          elif [ "$(jq -r '.mergeable' pr.json)" = "CONFLICTING" ]; then
            echo "PR is in conflict with main. Leaving it open for Dependabot to rebase."
            echo "merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge
        if: steps.guard.outputs.merge == 'true'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          # The commit the guard step inspected. Not github.event.pull_request.head.sha, which is
          # the head as of the review and can be older still.
          HEAD_SHA: ${{ steps.guard.outputs.head }}
        run: |
          set -euo pipefail
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json body --jq '.body' |
            gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --merge \
              --match-head-commit "$HEAD_SHA" \
              --subject "$TITLE (#$PR) [skip ci]" --body-file -
