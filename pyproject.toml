[project]
name = "ldbc-graphalytics-arcadedb-benchmarks"
version = "0.1.0"
description = "Python benchmark harness for LDBC Graphalytics (Mode 2) and LSQB (Mode 3) multi-vendor comparisons"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0"]
kuzu = ["kuzu>=0.4"]
duckdb = ["duckdb>=0.10"]
falkordb = ["falkordb>=1.0", "redis>=5.0"]
memgraph = ["pymgclient>=1.3"]
arangodb = ["python-arango>=7.9"]
postgresql = ["psycopg2-binary>=2.9"]
all = [
    "ldbc-graphalytics-arcadedb-benchmarks[neo4j,kuzu,duckdb,falkordb,memgraph,arangodb,postgresql]",
]
